{{- /*
Secret opcional. Para criar um Secret com dados fornecidos via values,
use `helm install --set secrets.create=true --set secrets.data.jwtSecret=...`.
Em produção, prefira `secrets.existingSecret` referenciando um Secret
gerenciado por External Secrets Operator, Vault ou similar.
*/ -}}
{{- if and (not .Values.secrets.existingSecret) .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "batle-api.fullname" . }}-secrets
  labels:
    {{- include "batle-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ .Values.secrets.data.jwtSecret | quote }}
  databaseUrl: {{ .Values.secrets.data.databaseUrl | quote }}
  redisUrl: {{ .Values.secrets.data.redisUrl | quote }}
  natsUrl: {{ .Values.secrets.data.natsUrl | quote }}
{{- end }}
